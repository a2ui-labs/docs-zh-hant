          - A2UI 協議: specification/v0.9.1-a2ui.md
          - A2A 擴充: specification/v0.9.1-a2ui-extension-specification.md
          - 演進指南: specification/v0.9.1-evolution-guide.md
          - 基礎 Catalog 指南: specification/v0.9.1-basic-catalog-implementation-guide.md
      - v0.9（前一穩定版）:
          - A2UI 協議: specification/v0.9-a2ui.md
          - 演進指南: specification/v0.9-evolution-guide.md
      - v0.8（舊版）:
          - A2UI 協議: specification/v0.8-a2ui.md
          - A2A 擴充: specification/v0.8-a2a-extension.md
  - 生態:
      - A2UI 的實際案例: ecosystem/a2ui-in-the-world.md
      - 社群 Renderer: ecosystem/renderers.md
      - 社群: ecosystem/community.md
  - 路線圖: roadmap.md

exclude_docs: |
  scripts/**
  specification/v*/**/*.md

repo_name: a2ui-project/a2ui
repo_url: https://github.com/a2ui-project/a2ui
edit_uri: raw/main/docs/public/

copyright: Copyright Google 2025&nbsp;&nbsp;|&nbsp;&nbsp;<a href="//policies.google.com/terms">Terms</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="//policies.google.com/privacy">Privacy</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="#__consent">Manage cookies</a>

extra_css:
  - stylesheets/custom.css

theme:
  name: material
  font:
    text: Google Sans
    code: Roboto Mono
  logo: assets/A2UI_light.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  palette:
    - scheme: default
      primary: teal
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: teal
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - announce.dismiss
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - meta
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

hooks:
  - hooks.py

plugins:
  - search
  - macros
  - mermaid2
  - redirects:
      redirect_maps:
        'catalogs.md': 'concepts/catalogs.md'
        'transports.md': 'concepts/transports.md'
        'client_to_server_actions.md': 'concepts/actions.md'
        'concepts/client_to_server_actions.md': 'concepts/actions.md'
        'actions.md': 'concepts/actions.md'
        'renderers.md': 'reference/renderers.md'
        'agents.md': 'reference/agents.md'
        'community.md': 'ecosystem/community.md'
        'introduction/where-is-it-used.md': 'ecosystem/a2ui-in-the-world.md'
        'guides/custom-components.md': 'guides/authoring-components.md'
        'guides/guide_a2ui_dynamic_mcp.md': 'guides/a2ui-in-mcp-apps.md'
        'guides/mcp-apps-in-a2ui-surface.md': 'guides/mcp-apps-in-a2ui.md'
