      - 主題與樣式: guides/theming.md
      - A2UI + MCP:
          - 透過 MCP 使用 A2UI: guides/a2ui_over_mcp.md
          - A2UI 中的 MCP Apps: guides/mcp-apps-in-a2ui.md
          - MCP Apps 中的 A2UI: guides/a2ui-in-mcp-apps.md
  - 參考:
      - 元件畫廊: reference/components.md
      - 訊息參考: reference/messages.md
      - Renderer（客戶端）: reference/renderers.md
      - Agent（伺服端）: reference/agents.md
  - 規範:
      - v1.0（候選版）:
          - A2UI 協議: specification/v1.0-a2ui.md
          - A2A 擴充: specification/v1.0-a2ui-extension-specification.md
